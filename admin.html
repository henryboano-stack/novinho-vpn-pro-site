
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>Administração | NOVINHO VPN PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  background: #07111f;
  color: white;
  font-family: Arial, sans-serif;
  padding: 18px;
  margin: 0;
}

.container {
  max-width: 460px;
  margin: 35px auto;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.header h1 {
  color: #19d3a2;
  font-size: 26px;
}

.header p {
  color: #91a4b9;
  font-size: 12px;
  letter-spacing: 2px;
}

.card {
  background: #101e30;
  border: 1px solid #26394e;
  padding: 22px;
  border-radius: 15px;
}

h2 {
  color: #19d3a2;
  font-size: 20px;
}

.subtitle {
  color: #9caec2;
  font-size: 13px;
  line-height: 1.5;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 8px;
  border: 1px solid #344761;
  background: #091525;
  color: white;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 14px;
  border-radius: 8px;
  border: none;
  background: #19d3a2;
  color: #06131d;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.logout {
  background: #d94b60;
  color: white;
}

.hidden {
  display: none;
}

#result {
  margin-top: 18px;
  padding: 12px;
  border-radius: 8px;
  background: #091525;
  color: #c5d3e1;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
  display: none;
}

.footer {
  text-align: center;
  color: #71859b;
  font-size: 11px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>NOVINHO VPN PRO</h1>
    <p>PAINEL ADMINISTRATIVO</p>
  </div>

  <div class="card">

    <div id="loginArea">

      <h2>Entrar como administrador</h2>

      <p class="subtitle">
        Introduz as tuas credenciais administrativas.
      </p>

      <input
        id="email"
        type="email"
        placeholder="Email administrativo"
        autocomplete="username"
      >

      <input
        id="password"
        type="password"
        placeholder="Senha administrativa"
        autocomplete="current-password"
      >

      <button id="loginBtn">
        ENTRAR
      </button>

    </div>

    <div id="clientArea" class="hidden">

      <h2>Criar novo cliente</h2>

      <p class="subtitle">
        Regista uma nova conta para aceder ao NOVINHO VPN PRO.
      </p>

      <input
        id="username"
        type="text"
        placeholder="Nome do utilizador"
        autocomplete="off"
      >

      <input
        id="clientPassword"
        type="password"
        placeholder="Senha do cliente"
        autocomplete="new-password"
      >

      <button id="createBtn">
        CRIAR CLIENTE
      </button>

      <button id="logoutBtn" class="logout">
        TERMINAR SESSÃO
      </button>

    </div>

    <div id="result"></div>

  </div>

  <div class="footer">
    © 2026 NOVINHO VPN PRO. Todos os direitos reservados.
  </div>

</div>

<script>
const SUPABASE_URL =
  "https://yaawdvqonfxnyiedcddq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_tNYy4TfzPcYLo6B33MNcvA_CXOPSYWF";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const loginArea = document.getElementById("loginArea");
const clientArea = document.getElementById("clientArea");
const result = document.getElementById("result");

function showMessage(message, success = false) {
  result.style.display = "block";
  result.style.color = success ? "#19d3a2" : "#ffb6c4";
  result.textContent = message;
}

function showAdmin(username) {
  loginArea.classList.add("hidden");
  clientArea.classList.remove("hidden");

  showMessage(
    "Administrador autenticado: " + username,
    true
  );
}

// ENTRAR COMO ADMINISTRADOR

document.getElementById("loginBtn").onclick = async () => {

  const button = document.getElementById("loginBtn");

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Preenche o email e a senha.");
    return;
  }

  button.disabled = true;
  button.textContent = "A VERIFICAR...";

  try {

    const { data, error } =
      await supabase.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      throw error;
    }

    const { data: profile, error: profileError } =
      await supabase
        .from("user_profiles")
        .select("username, role, status")
        .eq("id", data.user.id)
        .single();

    if (
      profileError ||
      !profile ||
      profile.role !== "admin" ||
      profile.status !== "active"
    ) {
      await supabase.auth.signOut();

      showMessage(
        "Acesso reservado ao administrador autorizado."
      );

      return;
    }

    showAdmin(profile.username);

  } catch (error) {

    showMessage(
      "Não foi possível entrar: " + error.message
    );

  } finally {

    button.disabled = false;
    button.textContent = "ENTRAR";

  }
};


// CRIAR CLIENTE

document.getElementById("createBtn").onclick = async () => {

  const button = document.getElementById("createBtn");

  const username =
    document.getElementById("username").value.trim().toLowerCase();

  const password =
    document.getElementById("clientPassword").value;

  if (!/^[a-z0-9_]{3,30}$/.test(username)) {
    showMessage(
      "O utilizador deve ter entre 3 e 30 caracteres. Usa apenas letras, números e _."
    );
    return;
  }

  if (password.length < 8 || password.length > 72) {
    showMessage(
      "A senha deve ter entre 8 e 72 caracteres."
    );
    return;
  }

  button.disabled = true;
  button.textContent = "A CRIAR CLIENTE...";

  try {

    const { data: sessionData } =
      await supabase.auth.getSession();

    if (!sessionData.session) {
      throw new Error(
        "A sessão administrativa terminou. Entra novamente."
      );
    }

    const { data, error } =
      await supabase.functions.invoke(
        "quick-processor",
        {
          body: {
            username: username,
            password: password
          }
        }
      );

    if (error) {
      throw error;
    }

    if (!data || !data.success) {
      throw new Error(
        data?.error || "Não foi possível criar o cliente."
      );
    }

    showMessage(
      "CLIENTE CRIADO COM SUCESSO! Utilizador: " +
      data.username,
      true
    );

    document.getElementById("username").value = "";
    document.getElementById("clientPassword").value = "";

  } catch (error) {

    showMessage(
      "Erro ao criar cliente: " + error.message
    );

  } finally {

    button.disabled = false;
    button.textContent = "CRIAR CLIENTE";

  }

};


// TERMINAR SESSÃO

document.getElementById("logoutBtn").onclick = async () => {

  await supabase.auth.signOut();

  location.reload();

};

</script>

</body>
</html>
