
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>Administração | NOVINHO VPN PRO</title>

<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#07111f;color:white;font-family:Arial,sans-serif}
.container{max-width:460px;margin:35px auto}
.header{text-align:center;margin-bottom:25px}
.header h1{color:#19d3a2;font-size:26px}
.header p{color:#91a4b9;font-size:12px;letter-spacing:2px}
.card{background:#101e30;border:1px solid #26394e;padding:22px;border-radius:15px}
h2{color:#19d3a2;font-size:20px}
.subtitle{color:#9caec2;font-size:13px;line-height:1.5}
input{width:100%;padding:14px;margin-top:12px;border-radius:8px;border:1px solid #344761;background:#091525;color:white;font-size:15px}
button{width:100%;padding:14px;margin-top:14px;border:0;border-radius:8px;background:#19d3a2;color:#06131d;font-size:14px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.logout{background:#d94b60;color:white}
.hidden{display:none}
#result{display:block;margin-top:18px;padding:12px;border-radius:8px;background:#091525;color:#c5d3e1;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.footer{text-align:center;color:#71859b;font-size:11px;margin-top:25px}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <h1>NOVINHO VPN PRO</h1>
    <p>PAINEL ADMINISTRATIVO</p>
  </div>

  <div class="card">

    <form id="loginForm">
      <div id="loginArea">
        <h2>Entrar como administrador</h2>
        <p class="subtitle">Introduz as tuas credenciais administrativas.</p>

        <input id="email" type="email" placeholder="Email administrativo" autocomplete="username" required>

        <input id="password" type="password" placeholder="Senha administrativa" autocomplete="current-password" required>

        <button id="loginBtn" type="submit">ENTRAR</button>
      </div>
    </form>

    <div id="clientArea" class="hidden">
      <h2>Criar novo cliente</h2>
      <p class="subtitle">Regista uma nova conta para aceder ao NOVINHO VPN PRO.</p>

      <input id="username" type="text" placeholder="Nome do utilizador" autocomplete="off">

      <input id="clientPassword" type="password" placeholder="Senha do cliente" autocomplete="new-password">

      <button id="createBtn" type="button">CRIAR CLIENTE</button>
      <button id="logoutBtn" class="logout" type="button">TERMINAR SESSÃO</button>
    </div>

    <div id="result">A preparar o painel...</div>

  </div>

  <div class="footer">
    © 2026 NOVINHO VPN PRO. Todos os direitos reservados.
  </div>

</div>

<script>
"use strict";

// CONFIGURAÇÃO SUPABASE

const SUPABASE_URL =
"https://yaawdvqonfxnyiedcddq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_tNYy4TfzPcYLo6B33MNcvA_CXOPSYWF";

let accessToken = null;
let adminEmail = null;

// ELEMENTOS

const result = document.getElementById("result");
const loginArea = document.getElementById("loginArea");
const clientArea = document.getElementById("clientArea");
const loginBtn = document.getElementById("loginBtn");

function message(text, success = false) {
  result.textContent = text;
  result.style.color = success ? "#19d3a2" : "#ffb6c4";
}

function timeoutSignal(seconds) {
  return AbortSignal.timeout(seconds * 1000);
}

async function readResponse(response) {
  const text = await response.text();

  let data = {};

  try {
    data = text ? JSON.parse(text) : {};
  } catch {
    throw new Error("O servidor devolveu uma resposta inválida.");
  }

  if (!response.ok) {
    throw new Error(
      data.msg ||
      data.message ||
      data.error_description ||
      data.error ||
      data.details ||
      ("Erro HTTP " + response.status)
    );
  }

  return data;
}

// TESTAR CONFIGURAÇÃO

if (!SUPABASE_URL || !SUPABASE_KEY) {
  message("Erro: configuração do Supabase incompleta.");
} else {
  message("Painel preparado. Podes introduzir os teus dados.", true);
}

// ENTRADA DO ADMINISTRADOR

document.getElementById("loginForm").addEventListener("submit", async function(event) {

  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    message("Preenche o email e a senha.");
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "A AUTENTICAR...";
  message("A contactar o Supabase...");

  try {

    // 1. AUTENTICAR

    const authResponse = await fetch(
      SUPABASE_URL + "/auth/v1/token?grant_type=password",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email: email,
          password: password
        }),
        signal: timeoutSignal(20)
      }
    );

    const authData = await readResponse(authResponse);

    if (!authData.access_token || !authData.user) {
      throw new Error("O Supabase não devolveu uma sessão válida.");
    }

    accessToken = authData.access_token;
    adminEmail = email;

    // 2. VERIFICAR PERFIL ADMINISTRATIVO

    message("Login aceite. A verificar permissões...");

    const profileResponse = await fetch(
      SUPABASE_URL +
      "/rest/v1/user_profiles?select=username,role,status&id=eq." +
      encodeURIComponent(authData.user.id),
      {
        method: "GET",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken
        },
        signal: timeoutSignal(20)
      }
    );

    const profiles = await readResponse(profileResponse);

    if (!Array.isArray(profiles) || profiles.length !== 1) {
      throw new Error("Perfil administrativo não encontrado ou não acessível.");
    }

    const profile = profiles[0];

    if (profile.role !== "admin") {
      throw new Error("Esta conta não tem permissões de administrador.");
    }

    if (profile.status !== "active") {
      throw new Error("A conta administrativa não está activa.");
    }

    // 3. ABRIR PAINEL

    loginArea.classList.add("hidden");
    clientArea.classList.remove("hidden");

    document.getElementById("password").value = "";

    message(
      "Bem-vindo, administrador " +
      (profile.username || adminEmail) + "!",
      true
    );

  } catch (error) {

    accessToken = null;
    adminEmail = null;

    let errorMessage = error.message || "Erro desconhecido.";

    if (error.name === "TimeoutError" || error.name === "AbortError") {
      errorMessage = "O Supabase demorou a responder. Verifica a internet e tenta novamente.";
    }

    message("ERRO NO LOGIN: " + errorMessage);

  } finally {

    loginBtn.disabled = false;
    loginBtn.textContent = "ENTRAR";

  }

});

// CRIAR CLIENTE

document.getElementById("createBtn").addEventListener("click", async function() {

  const button = this;

  const username = document.getElementById("username")
    .value.trim().toLowerCase();

  const password = document.getElementById("clientPassword").value;

  if (!accessToken) {
    message("Sessão administrativa não encontrada. Entra novamente.");
    return;
  }

  if (!/^[a-z0-9_]{3,30}$/.test(username)) {
    message("O utilizador deve ter entre 3 e 30 caracteres. Usa letras, números e _.");
    return;
  }

  if (password.length < 8 || password.length > 72) {
    message("A senha deve ter entre 8 e 72 caracteres.");
    return;
  }

  button.disabled = true;
  button.textContent = "A CRIAR CLIENTE...";

  try {

    const response = await fetch(
      SUPABASE_URL + "/functions/v1/quick-processor",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username: username,
          password: password
        }),
        signal: timeoutSignal(30)
      }
    );

    const data = await readResponse(response);

    if (!data.success) {
      throw new Error(data.error || "Não foi possível criar o cliente.");
    }

    message(
      "CLIENTE CRIADO COM SUCESSO! Utilizador: " + data.username,
      true
    );

    document.getElementById("username").value = "";
    document.getElementById("clientPassword").value = "";

  } catch (error) {

    message("ERRO AO CRIAR CLIENTE: " + error.message);

  } finally {

    button.disabled = false;
    button.textContent = "CRIAR CLIENTE";

  }

});

// TERMINAR SESSÃO

document.getElementById("logoutBtn").addEventListener("click", function() {

  accessToken = null;
  adminEmail = null;

  location.reload();

});

</script>
</body>
</html>
