
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administração | NOVINHO VPN PRO</title>
<meta name="theme-color" content="#07111f">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#07111f;color:white;font-family:Arial,sans-serif}
.container{max-width:460px;margin:35px auto}
.header{text-align:center;margin-bottom:25px}
.header h1{color:#19d3a2;font-size:26px}
.header p{color:#91a4b9;font-size:12px;letter-spacing:2px}
.card{background:#101e30;border:1px solid #26394e;padding:22px;border-radius:15px}
h2{color:#19d3a2;font-size:20px}
.subtitle{color:#9caec2;font-size:13px;line-height:1.5}
input{width:100%;padding:14px;margin-top:12px;border-radius:8px;border:1px solid #344761;background:#091525;color:white;font-size:15px}
button{width:100%;padding:14px;margin-top:14px;border:0;border-radius:8px;background:#19d3a2;color:#06131d;font-size:14px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.logout{background:#d94b60;color:white}
.hidden{display:none}
#result{display:block;margin-top:18px;padding:12px;border-radius:8px;background:#091525;color:#c5d3e1;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.footer{text-align:center;color:#71859b;font-size:11px;margin-top:25px}
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <h1>NOVINHO VPN PRO</h1>
    <p>PAINEL ADMINISTRATIVO</p>
  </div>

  <div class="card">
    <form id="loginForm">
      <div id="loginArea">
        <h2>Entrar como administrador</h2>
        <p class="subtitle">Introduz as tuas credenciais administrativas.</p>
        <input id="email" type="email" placeholder="Email administrativo" required>
        <input id="password" type="password" placeholder="Senha administrativa" required>
        <button id="loginBtn" type="submit">ENTRAR</button>
      </div>
    </form>

    <div id="clientArea" class="hidden">
      <h2>Criar novo cliente</h2>
      <p class="subtitle">Regista uma nova conta.</p>
      <input id="username" type="text" placeholder="Nome do utilizador">
      <input id="clientPassword" type="password" placeholder="Senha do cliente">
      <button id="createBtn" type="button">CRIAR CLIENTE</button>
      <button id="logoutBtn" class="logout" type="button">TERMINAR SESSÃO</button>
    </div>

    <div id="result">A preparar o sistema...</div>
  </div>

  <div class="footer">© 2026 NOVINHO VPN PRO. Todos os direitos reservados.</div>
</div>

<script>
const URL = "https://yaawdvqonfxnyiedcddq.supabase.co";
const KEY = "sb_publishable_tNYy4TfzPcYLo6B33MNcvA_CXOPSYWF";

const result = document.getElementById("result");
const loginArea = document.getElementById("loginArea");
const clientArea = document.getElementById("clientArea");
const loginBtn = document.getElementById("loginBtn");

function message(text, success=false) {
  result.textContent = text;
  result.style.color = success ? "#19d3a2" : "#ffb6c4";
}

let db = null;

try {
  if (!window.supabase || !window.supabase.createClient) {
    throw new Error("A biblioteca Supabase não carregou. Verifica a internet.");
  }

  db = window.supabase.createClient(URL, KEY);
  message("Sistema preparado. Podes entrar.", true);
} catch (e) {
  message("Erro de inicialização: " + e.message);
}

document.getElementById("loginForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!db) {
    message("O sistema Supabase não está disponível. Recarrega a página.");
    return;
  }

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    message("Preenche o email e a senha.");
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "A AUTENTICAR...";
  message("A contactar o Supabase...");

  try {
    const login = await db.auth.signInWithPassword({email, password});

    if (login.error) throw login.error;

    const profileResult = await db
      .from("user_profiles")
      .select("username, role, status")
      .eq("id", login.data.user.id)
      .single();

    if (profileResult.error) throw profileResult.error;

    const profile = profileResult.data;

    if (!profile || profile.role !== "admin" || profile.status !== "active") {
      await db.auth.signOut();
      throw new Error("A conta não tem permissões administrativas activas.");
    }

    loginArea.classList.add("hidden");
    clientArea.classList.remove("hidden");
    message("Bem-vindo, administrador " + profile.username + ".", true);

  } catch (e) {
    message("Não foi possível entrar: " + (e.message || "Erro desconhecido."));
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "ENTRAR";
  }
});

document.getElementById("createBtn").addEventListener("click", async function() {
  const button = this;
  const username = document.getElementById("username").value.trim().toLowerCase();
  const password = document.getElementById("clientPassword").value;

  if (!/^[a-z0-9_]{3,30}$/.test(username)) {
    message("O nome deve ter 3 a 30 caracteres: letras, números ou _.");
    return;
  }

  if (password.length < 8 || password.length > 72) {
    message("A senha deve ter entre 8 e 72 caracteres.");
    return;
  }

  button.disabled = true;
  button.textContent = "A CRIAR...";

  try {
    const session = await db.auth.getSession();

    if (session.error || !session.data.session) {
      throw new Error("Sessão terminada. Entra novamente.");
    }

    const response = await db.functions.invoke("quick-processor", {
      body: {username, password}
    });

    if (response.error) throw response.error;
    if (!response.data || !response.data.success) {
      throw new Error(response.data?.error || "Não foi possível criar o cliente.");
    }

    message("Cliente criado com sucesso: " + response.data.username, true);
    document.getElementById("username").value = "";
    document.getElementById("clientPassword").value = "";

  } catch (e) {
    message("Erro ao criar cliente: " + e.message);
  } finally {
    button.disabled = false;
    button.textContent = "CRIAR CLIENTE";
  }
});

document.getElementById("logoutBtn").addEventListener("click", async function() {
  if (db) await db.auth.signOut();
  location.reload();
});
</script>
</body>
</html>
