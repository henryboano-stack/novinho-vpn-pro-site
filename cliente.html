
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVINHO VPN PRO - Área do Cliente</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #071b32, #102f50);
      color: white;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 30px 24px;
      border-radius: 18px;
      background: #102b46;
      box-shadow: 0 10px 35px rgba(0,0,0,.3);
    }

    .logo {
      text-align: center;
      font-size: 27px;
      font-weight: bold;
      color: #36d399;
      margin-bottom: 8px;
    }

    .subtitulo {
      text-align: center;
      color: #c3d3e3;
      margin-bottom: 28px;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      margin-bottom: 22px;
      font-size: 21px;
    }

    .alternar-area {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .alternar {
      flex: 1;
      padding: 11px 5px;
      margin: 0;
      background: #071b32;
      color: #c3d3e3;
      border: 1px solid #42617e;
      font-size: 13px;
    }

    .alternar.ativo {
      background: #36d399;
      color: #071b32;
      border-color: #36d399;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #42617e;
      border-radius: 9px;
      outline: none;
      background: #071b32;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #36d399;
    }

    input::placeholder {
      color: #8da4ba;
    }

    .senha-area {
      position: relative;
    }

    .senha-area input {
      padding-right: 75px;
    }

    .mostrar {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #36d399;
      font-size: 12px;
      cursor: pointer;
    }

    .principal {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 9px;
      background: #36d399;
      color: #071b32;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #mensagem {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .rodape {
      text-align: center;
      margin-top: 25px;
      color: #9eb3c8;
      font-size: 12px;
    }

    .ajuda {
      margin-top: 8px;
      color: #9eb3c8;
      font-size: 12px;
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">NOVINHO VPN PRO</div>
    <p class="subtitulo">A tua ligação começa aqui.</p>

    <h2>Área do Cliente</h2>

    <div class="alternar-area">
      <button type="button" class="alternar ativo" id="abaEntrar">
        ENTRAR
      </button>

      <button type="button" class="alternar" id="abaRegistar">
        CRIAR CONTA
      </button>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form id="formLogin">

      <label for="telefoneLogin">Número de telefone</label>
      <input
        type="tel"
        id="telefoneLogin"
        placeholder="+244 9XXXXXXXX"
        autocomplete="tel"
        required
      >

      <label for="senhaLogin">Palavra-passe</label>

      <div class="senha-area">
        <input
          type="password"
          id="senhaLogin"
          placeholder="A tua palavra-passe"
          autocomplete="current-password"
          required
        >
        <span class="mostrar" data-target="senhaLogin">Mostrar</span>
      </div>

      <button type="submit" class="principal" id="botaoEntrar">
        ENTRAR NA MINHA CONTA
      </button>

    </form>

    <!-- FORMULÁRIO DE REGISTO -->
    <form id="formRegisto" hidden>

      <label for="nomeCompleto">Nome completo</label>
      <input
        type="text"
        id="nomeCompleto"
        placeholder="Introduz o teu nome completo"
        autocomplete="name"
        minlength="2"
        required
      >

      <label for="telefoneRegisto">Número de telefone internacional</label>
      <input
        type="tel"
        id="telefoneRegisto"
        placeholder="+244 9XXXXXXXX"
        autocomplete="tel"
        required
      >

      <p class="ajuda">
        Inclui o indicativo do teu país. Exemplo: +244 para Angola.
      </p>

      <label for="senhaRegisto">Criar palavra-passe</label>

      <div class="senha-area">
        <input
          type="password"
          id="senhaRegisto"
          placeholder="Mínimo de 8 caracteres"
          autocomplete="new-password"
          minlength="8"
          required
        >
        <span class="mostrar" data-target="senhaRegisto">Mostrar</span>
      </div>

      <button type="submit" class="principal" id="botaoRegistar">
        CRIAR A MINHA CONTA
      </button>

    </form>

    <p id="mensagem" role="status" aria-live="polite"></p>

    <div class="rodape">
      NOVINHO VPN PRO © 2026
    </div>

  </main>

  <script>
    const SUPABASE_URL = "https://yaawdvqonfxnyiedcddq.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_tNYy4TfzPcYLo6B33MNcvA_CXOPSYWF";

    const clienteSupabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const formLogin = document.getElementById("formLogin");
    const formRegisto = document.getElementById("formRegisto");
    const mensagem = document.getElementById("mensagem");

    const abaEntrar = document.getElementById("abaEntrar");
    const abaRegistar = document.getElementById("abaRegistar");

    function mostrarMensagem(texto, cor) {
      mensagem.textContent = texto;
      mensagem.style.color = cor;
    }

    function normalizarTelefone(valor) {
      let telefone = valor.trim().replace(/[\s()-]/g, "");

      if (telefone.startsWith("00")) {
        telefone = "+" + telefone.slice(2);
      }

      return telefone;
    }

    function guardarSessao(data, telefone) {
      sessionStorage.setItem(
        "novinho_access_token",
        data.access_token
      );

      sessionStorage.setItem(
        "novinho_refresh_token",
        data.refresh_token
      );

      sessionStorage.setItem(
        "novinho_username",
        data.username || telefone
      );
    }

    function mudarFormulario(tipo) {
      const entrar = tipo === "entrar";

      formLogin.hidden = !entrar;
      formRegisto.hidden = entrar;

      abaEntrar.classList.toggle("ativo", entrar);
      abaRegistar.classList.toggle("ativo", !entrar);

      mostrarMensagem("", "#ffffff");
    }

    abaEntrar.addEventListener("click", function () {
      mudarFormulario("entrar");
    });

    abaRegistar.addEventListener("click", function () {
      mudarFormulario("registar");
    });

    document.querySelectorAll(".mostrar").forEach(function (elemento) {
      elemento.addEventListener("click", function () {
        const campo = document.getElementById(this.dataset.target);

        if (campo.type === "password") {
          campo.type = "text";
          this.textContent = "Ocultar";
        } else {
          campo.type = "password";
          this.textContent = "Mostrar";
        }
      });
    });

    // LOGIN COM TELEFONE
    formLogin.addEventListener("submit", async function (evento) {
      evento.preventDefault();

      const telefone = normalizarTelefone(
        document.getElementById("telefoneLogin").value
      );

      const password = document.getElementById("senhaLogin").value;

      const botao = document.getElementById("botaoEntrar");

      if (!/^\+[1-9]\d{7,14}$/.test(telefone)) {
        mostrarMensagem(
          "Introduz o telefone com indicativo internacional, por exemplo +244.",
          "#ff7777"
        );
        return;
      }

      botao.disabled = true;
      botao.textContent = "A verificar...";

      mostrarMensagem("A verificar os teus dados. Aguarda...", "#ffffff");

      try {
        const { data, error } =
          await clienteSupabase.functions.invoke("login-cliente", {
            body: {
              phone: telefone,
              password: password
            }
          });

        if (error) throw error;

        if (
          !data ||
          data.success !== true ||
          !data.access_token ||
          !data.refresh_token
        ) {
          throw new Error(
            data?.message || "Telefone ou palavra-passe incorrectos."
          );
        }

        guardarSessao(data, telefone);

        mostrarMensagem("Entrada efectuada com sucesso!", "#36d399");

        window.location.href = "planos.html";

      } catch (erro) {
        console.error("Erro no login:", erro);

        mostrarMensagem(
          erro.message || "Não foi possível entrar. Tenta novamente.",
          "#ff7777"
        );

        botao.disabled = false;
        botao.textContent = "ENTRAR NA MINHA CONTA";
      }
    });

    // REGISTO DE NOVO CLIENTE
    formRegisto.addEventListener("submit", async function (evento) {
      evento.preventDefault();

      const nome = document.getElementById("nomeCompleto").value.trim();

      const telefone = normalizarTelefone(
        document.getElementById("telefoneRegisto").value
      );

      const password = document.getElementById("senhaRegisto").value;

      const botao = document.getElementById("botaoRegistar");

      if (nome.length < 2) {
        mostrarMensagem("Introduz o teu nome completo.", "#ff7777");
        return;
      }

      if (!/^\+[1-9]\d{7,14}$/.test(telefone)) {
        mostrarMensagem(
          "Telefone inválido. Usa o indicativo internacional, por exemplo +244.",
          "#ff7777"
        );
        return;
      }

      if (password.length < 8) {
        mostrarMensagem(
          "A palavra-passe deve ter pelo menos 8 caracteres.",
          "#ff7777"
        );
        return;
      }

      botao.disabled = true;
      botao.textContent = "A CRIAR CONTA...";

      mostrarMensagem("A criar a tua conta. Aguarda...", "#ffffff");

      try {
        const { data, error } =
          await clienteSupabase.functions.invoke("registar-cliente", {
            body: {
              full_name: nome,
              phone: telefone,
              password: password
            }
          });

        if (error) throw error;

        if (
          !data ||
          data.success !== true ||
          !data.access_token ||
          !data.refresh_token
        ) {
          throw new Error(
            data?.message || "Não foi possível criar a conta."
          );
        }

        guardarSessao(data, telefone);

        mostrarMensagem(
          "Conta criada com sucesso! A entrar...",
          "#36d399"
        );

        window.location.href = "planos.html";

      } catch (erro) {
        console.error("Erro no registo:", erro);

        mostrarMensagem(
          erro.message || "Não foi possível criar a conta. Tenta novamente.",
          "#ff7777"
        );

        botao.disabled = false;
        botao.textContent = "CRIAR A MINHA CONTA";
      }
    });
  </script>

</body>
</html>
