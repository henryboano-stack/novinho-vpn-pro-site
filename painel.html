<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">

  <title>Painel do Cliente | NOVINHO VPN PRO</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #07111f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 45px auto;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      color: #19d3a2;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo p {
      color: #9caec2;
      font-size: 12px;
      margin-top: 8px;
      letter-spacing: 2px;
    }

    .card {
      background: #101e30;
      border: 1px solid #24364c;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    }

    .card h2 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9caec2;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .info {
      background: #0a1727;
      border: 1px solid #24364c;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 13px;
    }

    .info small {
      display: block;
      color: #8fa5bc;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .info strong {
      color: #ffffff;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .status {
      color: #19d3a2 !important;
    }

    .loading {
      text-align: center;
      padding: 35px 10px;
      color: #b9c8d8;
      font-size: 14px;
    }

    .spinner {
      width: 35px;
      height: 35px;
      border: 4px solid #26394e;
      border-top-color: #19d3a2;
      border-radius: 50%;
      margin: 0 auto 18px;
      animation: girar 1s linear infinite;
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      display: none;
      background: #351b25;
      border: 1px solid #85364c;
      color: #ffb6c4;
      padding: 17px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #19d3a2;
      color: #06131d;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      color: #71859b;
      font-size: 11px;
      margin-top: 25px;
    }

    #dashboard {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <h1>NOVINHO VPN PRO</h1>
      <p>ÁREA PRIVADA DO CLIENTE</p>
    </div>

    <div class="card">

      <div id="loading" class="loading">
        <div class="spinner"></div>
        A verificar a tua conta...
      </div>

      <div id="error" class="error"></div>

      <div id="dashboard">

        <h2>Bem-vindo!</h2>

        <p class="subtitle">
          A tua conta foi identificada com sucesso.
        </p>

        <div class="info">
          <small>Nome de utilizador</small>
          <strong id="username">---</strong>
        </div>

        <div class="info">
          <small>Estado da conta</small>
          <strong id="status" class="status">---</strong>
        </div>

        <div class="info">
          <small>Validade da conta</small>
          <strong id="expires">---</strong>
        </div>

        <button class="btn" id="logoutBtn" onclick="logout()">
          TERMINAR SESSÃO
        </button>

      </div>

    </div>

    <div class="footer">
      © 2026 NOVINHO VPN PRO. Todos os direitos reservados.
    </div>

  </div>

  <script>
    // CONFIGURAÇÃO DO SUPABASE

    const SUPABASE_URL =
      "https://yaawdvqonfxnyiedcddq.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_tNYy4TfzPcYLo6B33MNcvA_CXOPSYWF";


    // CRIAR CLIENTE SUPABASE

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    // ELEMENTOS DA PÁGINA

    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");
    const dashboard = document.getElementById("dashboard");


    // MOSTRAR ERRO

    function showError(message) {
      loading.style.display = "none";
      dashboard.style.display = "none";
      errorBox.style.display = "block";
      errorBox.textContent = message;
    }


    // FORMATAR DATA

    function formatDate(dateValue) {
      if (!dateValue) {
        return "Sem data definida";
      }

      const date = new Date(dateValue);

      if (isNaN(date.getTime())) {
        return "Data indisponível";
      }

      return date.toLocaleDateString("pt-AO", {
        day: "2-digit",
        month: "long",
        year: "numeric"
      });
    }


    // CARREGAR DADOS DO CLIENTE

    async function loadDashboard() {

      const accessToken =
        sessionStorage.getItem("access_token");

      const refreshToken =
        sessionStorage.getItem("refresh_token");


      // VERIFICAR SE EXISTE SESSÃO

      if (!accessToken || !refreshToken) {
        window.location.replace("cliente.html");
        return;
      }


      // RESTAURAR SESSÃO

      const { data: sessionData, error: sessionError } =
        await supabaseClient.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });

      if (sessionError || !sessionData.session) {
        sessionStorage.removeItem("access_token");
        sessionStorage.removeItem("refresh_token");

        window.location.replace("cliente.html");
        return;
      }


      // ACTUALIZAR TOKENS

      sessionStorage.setItem(
        "access_token",
        sessionData.session.access_token
      );

      sessionStorage.setItem(
        "refresh_token",
        sessionData.session.refresh_token
      );


      // IDENTIFICAR UTILIZADOR

      const { data: userData, error: userError } =
        await supabaseClient.auth.getUser();

      if (userError || !userData.user) {
        sessionStorage.removeItem("access_token");
        sessionStorage.removeItem("refresh_token");

        window.location.replace("cliente.html");
        return;
      }


      // BUSCAR PERFIL NA BASE DE DADOS

      const { data: profile, error: profileError } =
        await supabaseClient
          .from("user_profiles")
          .select("username, role, status, expires_at")
          .eq("id", userData.user.id)
          .single();


      if (profileError || !profile) {
        throw new Error(
          "Não foi possível carregar os dados da tua conta. Verifica a ligação ou as permissões do servidor."
        );
      }


      // VERIFICAR TIPO DE CONTA

      if (profile.role !== "client") {
        throw new Error(
          "Esta conta não tem autorização para entrar nesta área."
        );
      }


      // VERIFICAR ESTADO DA CONTA

      if (profile.status !== "active") {
        throw new Error(
          "A tua conta encontra-se bloqueada ou inactiva. Contacta o administrador."
        );
      }


      // VERIFICAR VALIDADE

      if (
        profile.expires_at &&
        new Date(profile.expires_at).getTime() <= Date.now()
      ) {
        throw new Error(
          "A validade da tua conta terminou. Contacta o administrador para renovar."
        );
      }


      // MOSTRAR INFORMAÇÕES

      document.getElementById("username").textContent =
        profile.username;

      document.getElementById("status").textContent =
        "ACTIVA";

      document.getElementById("expires").textContent =
        formatDate(profile.expires_at);


      // MOSTRAR PAINEL

      loading.style.display = "none";
      errorBox.style.display = "none";
      dashboard.style.display = "block";
    }


    // TEMPO MÁXIMO DE ESPERA: 15 SEGUNDOS

    const timeout = new Promise((_, reject) => {
      setTimeout(() => {
        reject(new Error(
          "O servidor está a demorar a responder. Verifica a internet e tenta novamente."
        ));
      }, 15000);
    });


    // INICIAR VERIFICAÇÃO

    Promise.race([
      loadDashboard(),
      timeout
    ]).catch(error => {
      showError(error.message || "Ocorreu um erro ao carregar a tua conta.");
    });


    // TERMINAR SESSÃO

    async function logout() {

      const button = document.getElementById("logoutBtn");

      button.disabled = true;
      button.textContent = "A terminar sessão...";

      try {
        await supabaseClient.auth.signOut();
      } catch (error) {
        console.error(error);
      }

      sessionStorage.removeItem("access_token");
      sessionStorage.removeItem("refresh_token");

      window.location.replace("cliente.html");
    }

  </script>

</body>
            </html>
